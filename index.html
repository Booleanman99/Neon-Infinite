<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON DRIFT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.40.0/babylon.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    body{overflow:hidden;background:#030308;font-family:'Share Tech Mono',monospace;color:#fff}
    canvas{display:block;width:100vw;height:100vh;outline:none}
    #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
    #ui>*{pointer-events:auto}

    #start-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 50% 55%,rgba(0,255,255,0.04) 0%,rgba(3,3,8,0.95) 55%);z-index:50;transition:opacity 0.8s}
    #start-screen.hidden{opacity:0;pointer-events:none}
    #start-screen h1{font-family:'Orbitron',sans-serif;font-size:clamp(26px,7vw,72px);font-weight:700;letter-spacing:0.35em;
      color:#0ff;text-shadow:0 0 60px #0ff6,0 0 120px #0ff3;text-transform:uppercase}
    #start-screen .sub{font-size:clamp(9px,1.3vw,12px);letter-spacing:0.7em;color:#f067;text-transform:uppercase;margin-top:6px;margin-bottom:56px}
    .btn-go{background:transparent;border:1px solid #0ff3;color:#0ff;padding:15px 60px;font-size:clamp(10px,1.2vw,13px);
      letter-spacing:0.4em;cursor:pointer;text-transform:uppercase;font-family:'Share Tech Mono',monospace;
      box-shadow:0 0 30px #0ff12,inset 0 0 30px #0ff08;outline:none;transition:all 0.3s}
    .btn-go:hover{background:#0ff0a;border-color:#0ff9;box-shadow:0 0 40px #0ff25,inset 0 0 40px #0ff12}
    #start-screen .hint{margin-top:50px;font-size:clamp(8px,1vw,10px);color:#fff2;letter-spacing:0.2em;text-align:center;line-height:2.6}

    #crash-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at center,rgba(50,0,15,0.5) 0%,rgba(3,3,8,0.9) 55%);z-index:50;transition:opacity 0.5s;opacity:0;pointer-events:none}
    #crash-screen.show{opacity:1;pointer-events:auto}
    #crash-screen h2{font-family:'Orbitron',sans-serif;font-size:clamp(22px,5vw,50px);font-weight:700;letter-spacing:0.3em;
      color:#f06;text-shadow:0 0 50px #f068;text-transform:uppercase;margin-bottom:12px}
    #crash-screen .sf{font-size:clamp(14px,2vw,22px);color:#fff5;letter-spacing:0.22em;margin-bottom:42px}
    .btn-retry{background:transparent;border:1px solid #f065;color:#f06;padding:13px 48px;font-size:clamp(10px,1.2vw,12px);
      letter-spacing:0.35em;cursor:pointer;text-transform:uppercase;font-family:'Share Tech Mono',monospace;outline:none;
      box-shadow:0 0 25px #f0618;transition:all 0.3s}
    .btn-retry:hover{background:#f060c;box-shadow:0 0 35px #f0628}

    #hud{position:absolute;inset:0;opacity:0;transition:opacity 0.5s;pointer-events:none}
    #hud.show{opacity:1}
    #hud>*{pointer-events:auto}

    #spd-wrap{position:absolute;bottom:30px;left:30px;display:flex;align-items:flex-end;gap:6px}
    #spd-num{font-family:'Orbitron',sans-serif;font-size:clamp(40px,9vw,84px);font-weight:400;line-height:1;text-shadow:0 0 30px #0ff1a}
    #spd-unit{font-size:clamp(8px,1vw,11px);color:#fff3;letter-spacing:0.2em;margin-bottom:clamp(8px,1.5vw,16px);text-transform:uppercase}

    #sc-wrap{position:absolute;bottom:30px;right:30px;text-align:right}
    #sc-label{font-size:9px;color:#fff22;letter-spacing:0.35em;text-transform:uppercase;margin-bottom:3px}
    #sc-num{font-family:'Orbitron',sans-serif;font-size:clamp(20px,3.5vw,40px);font-weight:400;text-shadow:0 0 20px #f0622}

    #spd-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:#fff08}
    #spd-fill{height:100%;width:0;transition:width 0.08s;background:linear-gradient(90deg,#0ff4,#0ff);box-shadow:0 0 12px #0ff5}
    #spd-fill.hot{background:linear-gradient(90deg,#0ff,#f06)}

    #top-bar{position:absolute;top:18px;right:18px;display:flex;gap:8px;align-items:center}
    .cbtn{height:34px;border-radius:17px;background:#fff06;border:1px solid #fff12;color:#fff5;font-size:9px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;padding:0 15px;letter-spacing:0.2em;text-transform:uppercase;
      backdrop-filter:blur(8px);transition:all 0.2s;outline:none;font-family:'Share Tech Mono',monospace;gap:6px}
    .cbtn:hover{background:#fff12;border-color:#fff3}
    .cbtn.icon{width:34px;padding:0;font-size:13px}
    .cbtn.auto-on{border-color:#0f9;color:#0f9;background:#0f90a}
    #ap-badge{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:0.35em;
      color:#0f955;text-transform:uppercase;border:1px solid #0f91a;padding:5px 20px;border-radius:2px;display:none}
    #ap-badge.show{display:block}

    .ov{position:absolute;inset:0;z-index:40;background:rgba(3,3,8,0.72);backdrop-filter:blur(8px);
      display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s}
    .ov.show{opacity:1;pointer-events:auto}
    .pnl{background:rgba(8,8,20,0.97);border:1px solid #fff0c;border-radius:6px;padding:30px 34px;min-width:290px;
      box-shadow:0 0 80px #0ff04}
    .pnl-t{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:0.5em;text-transform:uppercase;color:#fff3;margin-bottom:26px;text-align:center}
    .cr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #fff08}
    .ck{font-size:11px;color:#0ff;letter-spacing:0.12em}
    .cd{font-size:10px;color:#fff4;letter-spacing:0.18em;text-transform:uppercase}
    .sg{margin-bottom:24px}
    .sl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:0.28em;color:#fff3;text-transform:uppercase;margin-bottom:10px}
    .sv{color:#0ff6}
    input[type=range]{width:100%;accent-color:#0ff;cursor:pointer;margin-bottom:5px}
    .rl{display:flex;justify-content:space-between;font-size:8px;color:#fff12;letter-spacing:0.18em;text-transform:uppercase}
    .cg{display:flex;gap:6px;flex-wrap:wrap}
    .chip{background:transparent;border:1px solid #fff15;color:#fff44;padding:7px 16px;font-size:10px;letter-spacing:0.24em;
      text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all 0.2s;font-family:'Share Tech Mono',monospace;outline:none}
    .chip.ac{border-color:#0ff;color:#0ff;background:#0ff12}
    .chip.ap{border-color:#f06;color:#f06;background:#f0612}
    .chip.ag{border-color:#0f9;color:#0f9;background:#0f912}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="start-screen">
      <h1>NEON DRIFT</h1>
      <div class="sub">infinite cyberpunk city</div>
      <button class="btn-go" id="go">begin</button>
      <div class="hint">W / ↑ accelerate · S / ↓ brake · A D / ← → steer · SHIFT boost</div>
    </div>
    <div id="crash-screen">
      <h2>wrecked</h2>
      <div class="sf"><span id="fs">0</span> pts</div>
      <button class="btn-retry" id="re">retry</button>
    </div>
    <div id="hud">
      <div id="spd-wrap"><span id="spd-num">0</span><span id="spd-unit">km/h</span></div>
      <div id="sc-wrap"><div id="sc-label">score</div><div id="sc-num">0</div></div>
      <div id="spd-bar"><div id="spd-fill"></div></div>
      <div id="top-bar">
        <button class="cbtn" id="abtn">auto: off</button>
        <button class="cbtn icon" id="hbtn">?</button>
        <button class="cbtn icon" id="sbtn">⚙</button>
      </div>
      <div id="ap-badge">autopilot</div>
    </div>
    <div class="ov" id="hov">
      <div class="pnl">
        <div class="pnl-t">controls</div>
        <div class="cr"><span class="ck">W / ↑</span><span class="cd">accelerate</span></div>
        <div class="cr"><span class="ck">S / ↓</span><span class="cd">brake</span></div>
        <div class="cr"><span class="ck">A / ←</span><span class="cd">steer left</span></div>
        <div class="cr"><span class="ck">D / →</span><span class="cd">steer right</span></div>
        <div class="cr"><span class="ck">SHIFT</span><span class="cd">boost</span></div>
      </div>
    </div>
    <div class="ov" id="sov">
      <div class="pnl" style="min-width:min(380px,88vw)">
        <div class="pnl-t">environment</div>
        <div class="sg">
          <div class="sl"><span>traffic density</span><span class="sv" id="tv">55%</span></div>
          <input type="range" min="0" max="1" step="0.05" value="0.55" id="tsl">
          <div class="rl"><span>empty</span><span>gridlock</span></div>
        </div>
        <div class="sg"><div class="sl"><span>weather</span></div><div class="cg" id="wc"></div></div>
        <div class="sg"><div class="sl"><span>time of day</span></div><div class="cg" id="tc"></div></div>
        <div class="sg"><div class="sl"><span>autopilot</span></div><div class="cg" id="apc"></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
